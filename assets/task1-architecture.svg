<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Task 1 event service architecture</title>
  <desc id="desc">HTTP clients call Fastify event routes. Routes use the withAuth hook and event service. The event service uses UserLock, the event repository, and the iCalendar serializer. The repository accesses MongoDB events.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
    <style>
      .node { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .external { fill: #eff6ff; stroke: #2563eb; }
      .service { fill: #f0fdf4; stroke: #16a34a; }
      .storage { fill: #fff7ed; stroke: #ea580c; }
      .label { fill: #0f172a; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="430" fill="#ffffff" />

  <path class="edge" d="M180 90 H270" />
  <path class="edge" d="M415 90 H505" />
  <path class="edge" d="M342 125 V280" />
  <path class="edge" d="M650 90 H740" />
  <path class="edge" d="M577 125 V280" />
  <path class="edge" d="M620 125 V205 H812 V280" />
  <path class="edge" d="M885 315 H975" />

  <rect class="node external" x="30" y="55" width="150" height="70" rx="12" />
  <text class="label" x="105" y="90">HTTP Client</text>

  <rect class="node" x="270" y="55" width="145" height="70" rx="12" />
  <text class="label" x="342.5" y="80">Fastify Event</text>
  <text class="label" x="342.5" y="103">Routes</text>

  <rect class="node service" x="505" y="55" width="145" height="70" rx="12" />
  <text class="label" x="577.5" y="80">Event</text>
  <text class="label" x="577.5" y="103">Service</text>

  <rect class="node service" x="740" y="55" width="145" height="70" rx="12" />
  <text class="label" x="812.5" y="80">iCalendar</text>
  <text class="label" x="812.5" y="103">Serializer</text>

  <rect class="node service" x="270" y="280" width="145" height="70" rx="12" />
  <text class="label" x="342.5" y="315">withAuth hook</text>

  <rect class="node service" x="505" y="280" width="145" height="70" rx="12" />
  <text class="label" x="577.5" y="315">UserLock</text>

  <rect class="node" x="740" y="280" width="145" height="70" rx="12" />
  <text class="label" x="812.5" y="305">Event</text>
  <text class="label" x="812.5" y="328">Repository</text>

  <rect class="node storage" x="975" y="280" width="100" height="70" rx="12" />
  <text class="label" x="1025" y="305">MongoDB</text>
  <text class="label" x="1025" y="328">events</text>
</svg>
