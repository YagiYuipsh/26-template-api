# USThing API and MongoDB services.
#
# Optional Compose environment:
#   Copy .env.compose.example to .env.compose, then run:
#   docker compose --env-file .env.compose up -d
#
# The defaults below allow `docker compose up -d` to work when no conflicting
# project `.env` is present. MONGO_URI must use the `mongodb` service hostname
# inside the Compose network.

name: usthing

#
# Start it:
#
#   docker compose up -d
#
# Stop it:
#
#   docker compose stop
#
# Reset the data volume:
#
#   docker compose down -v

services:
  mongodb:
    image: mongo:8.3.4
    container_name: usthing-mongodb
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usthing-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      FASTIFY_ADDRESS: ${FASTIFY_ADDRESS:-0.0.0.0}
      FASTIFY_PORT: ${FASTIFY_PORT:-3000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/usthing}
      AUTH_SKIP: ${AUTH_SKIP:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  mongo_data:
