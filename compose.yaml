# USThing API and MongoDB services.
#
# MONGO_URI points to the MongoDB service inside the Compose network. Outside
# production, the application falls back to an in-memory MongoDB when it is
# unset.

name: usthing

#
# Start it:
#
#   docker compose up -d
#
# Stop it:
#
#   docker compose stop
#
# Reset the data volume:
#
#   docker compose down -v

services:
  mongodb:
    image: mongo:8.3.4
    container_name: usthing-mongodb
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usthing-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      FASTIFY_ADDRESS: 0.0.0.0
      FASTIFY_PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/usthing
      AUTH_SKIP: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  mongo_data:
